# fly.toml app configuration file generated for bolcash-api on 2026-11-22T08:36:13-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'bolcash-api'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
